modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="投影仪 | Projector"
# 模组列表里的图标：源文件在工作区 logo/ 目录，构建时打进 jar 根
logoFile="logo.png"
displayURL="https://github.com/hmjmfabc/ProjectorMC"
issueTrackerURL="https://github.com/hmjmfabc/ProjectorMC/issues"
authors="Hmjmfabc"
credits='''
使用 DeepSeek v4.1 Flash 与 DeepSeek Harness 编写。
灵感来源于游戏 Dancing Line 与 Through The Fog 的关卡内百分比标记。
'''
description='''
万物皆屏幕！

投影仪（Projector）让你可以在任何平面（完整方块墙、铁砧顶面、工作台侧面、楼梯……）上
粘贴图片、播放视频、书写任意字体的文字，并在上面摆放各种特殊控件：
文本、图片、视频、音乐、网页、时钟、天气、百分比进度、计时器、排行榜、棋类游戏。

字号与图片大小可无极调节、方向可任意摆放，操作方式接近 P 图与视频剪辑。

主要功能：
· U 键圈选准心所指的平面，Esc 取消，再次按 U 打开平面对话框（命名 / 内容保护 / 转让 / 删除）；
· 文本支持自定义 TTF 字体（放进 .minecraft/projector/fonts/）、& 格式化代码与调色盘，
  还能开启「打字」动画（一个字一个字冒出来）；
· 图片 / 视频从 .minecraft/projector/media/ 导入；视频由可选前置 WaterMedia 播放
  （MP4 / WebM / MKV / MOV / 直播流等），也可以直接粘贴 B 站链接等在线视频；
· 网页控件：在平面上显示网页（可选前置 MCEF），世界里左键操作页面、按 I 输入文字；
· 音乐控件：本地音频与网易云音乐，世界里直接点播放键即可启停，带歌词与波形；
· 流程（时间轴）：给控件编排入场 / 出场 / 循环动画，13 + 13 + 8 种动画都可在界面里实时预览；
· 棋类游戏：井字棋 / 五子棋 / 象棋 / 围棋 / 国际象棋，人机、双人与 AI 自走（斗蛐蛐）三种模式；
· 内容保护、创建者转让 / 删除，管理员与创建者分级权限；
· 完整支持 Android（触控启动器）与低配设备。

完整使用手册见仓库里的 PROJECTOR_GUIDE.md。
'''

# 音乐控件需要直接向游戏的音频引擎借一条流式声道
#（SoundManager.soundEngine / SoundEngine.channelAccess / SoundEngine.library）
[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# 【27.1.3】WaterMedia：**可选**前置模组。装了它才有视频功能（MP4/WebM/MKV/直播流…）。
# 本模组从不 import / 链接 / 打包它（PolyForm Strict 与本项目 Apache-2.0 不兼容），
# 只按公开 API 名字做运行时反射；这里声明 optional 只是让加载器知道「可有可无」。
[[dependencies.${mod_id}]]
modId="watermedia"
type="optional"
versionRange="[2.0,)"
ordering="NONE"
side="CLIENT"


# 【27.2】MCEF：**可选**前置模组。装了它才有网页控件（在平面上显示网页）。
# 本模组从不 import / 链接 / 打包它（LGPL-2.1：不修改也不包含它的源码即可另选许可），
# 只按公开 API 名字做运行时反射；这里声明 optional 只是让加载器知道「可有可无」。
# 服务端不需要装它（MCEF 的 displayTest=NONE，渲染完全在客户端）。
[[dependencies.${mod_id}]]
modId="mcef"
type="optional"
versionRange="[2.1,)"
ordering="NONE"
side="CLIENT"
