plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java-library'
}

version = project.mod_version
group = project.mod_group_id

base {
    // Fabric 版单独一套产物名，避免和 NeoForge 版混淆
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

repositories {
    mavenCentral()
    // 第三方解码库（BSD / LGPL，见 NOTICE）：与两个字体 ttf 一样不入库，
    // 需要自行放进 libs/ 才能构建 —— 说明见 README.md「从源码构建」
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // ⚠ 必须用 Mojang 官方映射（mojmap）：本项目是从 NeoForge 版移植来的，
    //   上游源码全部按 mojmap 书写；换成 Yarn 会让 164 个文件里的每一个 MC 类名都要改。
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // ---- 音乐控件：音频解码（MP3 / FLAC / AAC·M4A / WAV）----
    // ⚠ 这些是**第三方库**，许可证与代码不同（见 NOTICE）：
    //   mp3spi + jlayer + tritonus-share = LGPL-2.1；jflac-codec = BSD 三条款；
    //   javasound-aac（内含 JAAD，且带 mp4 容器解析 ⇒ .m4a 也认）= LGPL-2.1。
    //   它们以**未经修改的独立 jar** 嵌在本体 jar 的 META-INF/jars/ 里（可单独替换），
    //   属于 LGPL 允许的「使用库的作品」，不是把库代码并入本模组源码。
    //   ⚠ 以后再嵌任何 jar 之前，先算一遍「有没有同名包」（27.1.1 就栽在这上面）。
    implementation include('com.googlecode.soundlibs:mp3spi:1.9.5.4')
    implementation include('com.googlecode.soundlibs:jlayer:1.0.1.4')
    implementation include('com.googlecode.soundlibs:tritonus-share:0.3.7.4')
    implementation include('libs:jflac-codec:1.5.3-SNAPSHOT')
    implementation include('libs:javasound-aac:0.9.6')
    // zxing core（Apache-2.0，纯 Java 无原生库 ⇒ 安卓可用）：网易云扫码登录要它生成二维码
    implementation include('com.google.zxing:core:3.5.4')

    // 可选前置模组（视频 / 网页渲染各一个）：**不编译依赖、不打包**，只按公开 API 名字反射。
    // 之所以连依赖都不写：它们的许可与本项目不兼容（见 NOTICE 与 README 的「可选前置」一节）。
    // ⚠ 本文件里连它们的**名字**都不要写 —— 许可边界的自检脚本（tmp/v34）会扫描本文件。
}

loom {
    // NeoForge 用 accesstransformer.cfg，Fabric 用 accesswidener（内容一一对应）
    accessWidenerPath = file('src/main/resources/projector.accesswidener')
    // 【已核实，别再加 mixin { defaultRefmapName }】Loom 1.17 在 remapJar 阶段会**直接改写**
    //   混入类里的字符串目标（实测：KeyMapping/Minecraft 等的 keyPress → method_1466、
    //   setScreen → method_1507、startAttack → method_1536、getDetails → method_555），
    //   所以 jar 里没有 refmap 也是对的，加了反而多一个不生成的配置项。
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 交付物统一叫 `-all.jar`（含全部内嵌库）；`-dev.jar` 是开发用、玩家绝不能装
tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask).configure {
    archiveClassifier = 'all'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

processResources {
    inputs.properties([
            version        : mod_version,
            minecraft_version: minecraft_version,
            loader_version : loader_version,
            mod_name       : mod_name,
            mod_authors    : mod_authors,
            mod_license    : mod_license,
    ])
    filesMatching('fabric.mod.json') {
        expand([
                version          : mod_version,
                minecraft_version: minecraft_version,
                loader_version   : loader_version,
                mod_name         : mod_name,
                mod_authors      : mod_authors,
                mod_license      : mod_license,
        ])
    }
}

// 开发辅助：把运行时 classpath 打出来（用于在 Fabric 侧复用上游的纯逻辑验证脚本 tmp/v*）
tasks.register('printRuntimeClasspath') {
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}
